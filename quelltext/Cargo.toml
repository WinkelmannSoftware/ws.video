[package]
name = "ws-video"
version = "0.9.0"
edition = "2021"
description = "WS.Video – Bildschirmrekorder und Videoeditor für Linux (Wayland)"
license = "GPL-3.0-or-later"

[[bin]]
name = "ws-video"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
pangocairo = "0.22"
cairo-rs = { version = "0.22", features = ["png"] }
gst = { package = "gstreamer", version = "0.25", features = ["v1_22"] }
gst-base = { package = "gstreamer-base", version = "0.25" }
gst-video = { package = "gstreamer-video", version = "0.25" }
gst-audio = { package = "gstreamer-audio", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
gst-pbutils = { package = "gstreamer-pbutils", version = "0.25", features = ["v1_20"] }
gst-controller = { package = "gstreamer-controller", version = "0.25" }
ges = { package = "gstreamer-editing-services", version = "0.25", features = ["v1_22"] }
ashpd = { version = "0.14", default-features = false, features = ["async-io", "screencast"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
tract-onnx = "0.21"

[profile.release]
opt-level = 3
lto = "thin"
# Namen der Funktionen bleiben erhalten, damit ein Absturzbericht die Stelle im Programm nennt
strip = "debuginfo"

[profile.dev]
opt-level = 1
